name: 小黑盒每日任务与监测
run-name: "小黑盒每日 - ${{ inputs.mode }} - ${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check=只读；run=执行待完成；failure-drill=模拟失败'
        required: true
        type: choice
        default: check
        options: [check, run, failure-drill]
      confirm:
        description: '仅run模式填写RUN6'
        required: false
        type: string
        default: ''
      hosted_paused:
        description: '仅run勾选：原站已暂停，没有其他工具正在执行'
        type: boolean
        default: false
      monitor:
        description: 'run模式上报正式Healthchecks监测；日常外部触发必须为true'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: heybox-personal-account
  cancel-in-progress: false

jobs:
  cloud:
    name: 云端任务与邮件联动
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout personal repository
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Node 24
        id: node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Verify clean bundle
        id: verify
        run: node heybox-cloud/verify.mjs
      - name: Execute selected mode
        id: task
        continue-on-error: true
        env:
          CLOUD_MODE: ${{ inputs.mode }}
          CLOUD_CONFIRM: ${{ inputs.confirm }}
          HOSTED_PAUSED: ${{ inputs.hosted_paused }}
          HEYBOX_CONFIG_B64: ${{ inputs.mode != 'failure-drill' && secrets.HEYBOX_CONFIG_B64 || '' }}
        run: node heybox-cloud/entry.mjs
      - name: Send result email
        id: notify
        if: ${{ always() }}
        shell: bash
        env:
          CLOUD_MODE: ${{ inputs.mode }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          NODE_OUTCOME: ${{ steps.node.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          TASK_OUTCOME: ${{ steps.task.outcome }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import os
          
          
          import re
          
          
          import smtplib
          
          
          import ssl
          
          
          from dataclasses import dataclass
          
          
          from datetime import datetime, timedelta, timezone
          
          
          from email.headerregistry import Address
          
          
          from email.message import EmailMessage
          
          
          from email.utils import format_datetime, make_msgid
          
          
          BEIJING = timezone(timedelta(hours=8))
          
          
          class TestConfigurationError(Exception):
              pass
          
          
          @dataclass(frozen=True, repr=False)
          class MailConfig:
              user: str
              password: str
              recipient: str
          
          
          def required(environ, name):
              value = str(environ.get(name, "")).strip()
              if not value:
                  raise TestConfigurationError("SECRET_MISSING_" + name)
              return value
          
          
          def read_config(environ):
              user = required(environ, "SMTP_USER")
              password = required(environ, "SMTP_PASS")
              recipient = required(environ, "MAIL_TO")
              address = r"[A-Za-z0-9][A-Za-z0-9._+\-]{0,127}@qq\.com"
              if not re.fullmatch(address, user, flags=re.IGNORECASE):
                  raise TestConfigurationError("SMTP_USER_FORMAT_INVALID")
              if not re.fullmatch(address, recipient, flags=re.IGNORECASE):
                  raise TestConfigurationError("MAIL_TO_FORMAT_INVALID")
              if user.casefold() != recipient.casefold():
                  raise TestConfigurationError("SELF_MAIL_ADDRESSES_DIFFER")
              if not re.fullmatch(r"[!-~]{8,256}", password):
                  raise TestConfigurationError("SMTP_PASS_FORMAT_INVALID")
              return MailConfig(user, password, recipient)
          
          
          def send_notice(config, message, smtp_factory=None):
              factory = smtp_factory or smtplib.SMTP_SSL
              context = ssl.create_default_context()
              context.minimum_version = ssl.TLSVersion.TLSv1_2
              with factory("smtp.qq.com", 465, timeout=20, context=context) as smtp:
                  smtp.set_debuglevel(0)
                  smtp.login(config.user, config.password)
                  refused = smtp.send_message(message, from_addr=config.user, to_addrs=[config.recipient])
                  if refused:
                      raise TestConfigurationError("MAIL_RECIPIENT_REJECTED")
          
          
          def safe_error(error):
              if isinstance(error, TestConfigurationError):
                  known = {"SECRET_MISSING_SMTP_USER", "SECRET_MISSING_SMTP_PASS", "SECRET_MISSING_MAIL_TO",
                           "SMTP_USER_FORMAT_INVALID", "MAIL_TO_FORMAT_INVALID", "SELF_MAIL_ADDRESSES_DIFFER",
                           "SMTP_PASS_FORMAT_INVALID", "MANUAL_EVENT_REQUIRED", "REPOSITORY_MISMATCH",
                           "MAIN_BRANCH_REQUIRED", "SCENARIO_INVALID", "RUN_CONTEXT_INVALID", "MAIL_RECIPIENT_REJECTED"}
                  return str(error) if str(error) in known else "MAIL_TEST_CONFIG_INVALID"
              if isinstance(error, smtplib.SMTPAuthenticationError):
                  return "MAIL_AUTH_REJECTED"
              if isinstance(error, smtplib.SMTPRecipientsRefused):
                  return "MAIL_RECIPIENT_REJECTED"
              if isinstance(error, ssl.SSLCertVerificationError):
                  return "MAIL_TLS_VERIFY_FAILED"
              if isinstance(error, (TimeoutError, smtplib.SMTPServerDisconnected)):
                  return "MAIL_DELIVERY_NOT_CONFIRMED"
              if isinstance(error, smtplib.SMTPResponseException):
                  code = error.smtp_code
                  return f"MAIL_SMTP_REJECTED_{code}" if isinstance(code, int) and 100 <= code <= 599 else "MAIL_SMTP_REJECTED"
              if isinstance(error, OSError):
                  return "MAIL_CONNECTION_FAILED"
              return "MAIL_TEST_UNEXPECTED_ERROR"
          
          
          import json
          import os
          import re
          from datetime import datetime
          from pathlib import Path
          from email.headerregistry import Address
          from email.message import EmailMessage
          from email.utils import format_datetime, make_msgid
          
          IDS = ("sign", "1", "19", "31")
          NAMES = {"sign": "签到", "1": "分享帖子", "19": "分享游戏", "31": "分享游戏评价"}
          MARKERS = {"CLOUD_CHECK_OK", "CLOUD_RUN_VERIFIED", "CLOUD_RUN_SKIPPED", "CLOUD_FAILURE_DRILL", "CLOUD_TASK_FAILED"}
          
          
          def context(env):
              if env.get("GITHUB_REPOSITORY") != "zhangsan857/heybox-personal" or env.get("GITHUB_REF") != "refs/heads/main" or env.get("GITHUB_EVENT_NAME") != "workflow_dispatch":
                  raise ValueError("CLOUD_NOTICE_CONTEXT_DENIED")
              run_id, attempt = str(env.get("GITHUB_RUN_ID", "")), str(env.get("GITHUB_RUN_ATTEMPT", ""))
              if not re.fullmatch(r"[1-9][0-9]{0,23}", run_id) or not re.fullmatch(r"[1-9][0-9]{0,5}", attempt):
                  raise ValueError("CLOUD_NOTICE_CONTEXT_DENIED")
              mode = env.get("CLOUD_MODE", "unknown")
              if mode not in {"check", "run", "failure-drill"}:
                  raise ValueError("CLOUD_NOTICE_CONTEXT_DENIED")
              return {"mode": mode, "runId": run_id, "attempt": attempt, "id": run_id + "." + attempt,
                      "url": f"https://github.com/zhangsan857/heybox-personal/actions/runs/{run_id}"}
          
          
          def fallback(ctx, code):
              return {"ok": False, "mode": ctx["mode"], "simulated": False, "marker": "CLOUD_TASK_FAILED", "error": code,
                      "mutations": dict.fromkeys(IDS, 0), "executed": [], "skipped": []}
          
          
          def read_result(env, ctx):
              try:
                  if any(env.get(key) != "success" for key in ("CHECKOUT_OUTCOME", "NODE_OUTCOME", "VERIFY_OUTCOME")):
                      return fallback(ctx, "CLOUD_SETUP_FAILED")
                  if not env.get("RUNNER_TEMP"):
                      return fallback(ctx, "CLOUD_RESULT_MISSING")
                  file = Path(env["RUNNER_TEMP"]) / "heybox-cloud-result.json"
                  if not file.is_file():
                      return fallback(ctx, "CLOUD_RESULT_MISSING")
                  if file.stat().st_size > 65_536:
                      raise ValueError()
                  value = json.loads(file.read_text(encoding="utf-8"))
                  if value.get("schema") != 1 or value.get("runId") != ctx["runId"] or value.get("attempt") != ctx["attempt"] or value.get("mode") != ctx["mode"]:
                      raise ValueError()
                  if type(value.get("ok")) is not bool or type(value.get("simulated")) is not bool or value.get("marker") not in MARKERS:
                      raise ValueError()
                  if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", value.get("day", "")):
                      raise ValueError()
                  mutations = {key: value.get("mutations", {}).get(key) for key in IDS}
                  if any(type(number) is not int or not 0 <= number <= 50 for number in mutations.values()):
                      raise ValueError()
                  for key in ("executed", "skipped"):
                      items = value.get(key)
                      if not isinstance(items, list) or any(item not in IDS for item in items) or len(items) != len(set(items)):
                          raise ValueError()
                  if set(value["executed"]) & set(value["skipped"]):
                      raise ValueError()
                  result = {key: value[key] for key in ("ok", "mode", "simulated", "marker", "day", "executed", "skipped")}
                  result["mutations"] = mutations
                  if value["simulated"]:
                      if ctx["mode"] != "failure-drill" or value["ok"] or value["marker"] != "CLOUD_FAILURE_DRILL" or any(mutations.values()):
                          raise ValueError()
                  if value["ok"]:
                      if env.get("TASK_OUTCOME") != "success" or value["simulated"]:
                          return fallback(ctx, "CLOUD_STEP_NOT_SUCCESS")
                      states = {key: value.get("states", {}).get(key) for key in IDS}
                      if any(state not in {"finish", "waiting"} for state in states.values()):
                          raise ValueError()
                      if ctx["mode"] == "check" and (value["marker"] != "CLOUD_CHECK_OK" or any(mutations.values()) or value["executed"]):
                          raise ValueError()
                      if ctx["mode"] == "run":
                          if any(state != "finish" for state in states.values()) or set(value["executed"] + value["skipped"]) != set(IDS):
                              raise ValueError()
                          if any(mutations[key] <= 0 for key in value["executed"]):
                              raise ValueError()
                          if value["marker"] == "CLOUD_RUN_SKIPPED" and (value["executed"] or any(mutations.values())):
                              raise ValueError()
                          if value["marker"] not in {"CLOUD_RUN_SKIPPED", "CLOUD_RUN_VERIFIED"}:
                              raise ValueError()
                          if value["marker"] == "CLOUD_RUN_VERIFIED" and not value["executed"]:
                              raise ValueError()
                      result["states"] = states
                  else:
                      error = value.get("error", "")
                      if not re.fullmatch(r"(?:CLOUD_[A-Z0-9_]{1,80}|APP_AUTH_EXPIRED|UPSTREAM_RATE_LIMIT|UPSTREAM_CAPTCHA_REQUIRED|SIGN_NOT_VERIFIED|SHARE_NOT_SETTLED|TASK_SCHEMA_CHANGED|ACCOUNT_READBACK_MISMATCH|REQUEST_NOT_CONFIRMED(?::[a-z0-9_]{1,32}){0,3})", error):
                          raise ValueError()
                      result["error"] = error
                  return result
              except Exception:
                  return fallback(ctx, "CLOUD_RESULT_INVALID")
          
          
          def compose(config, ctx, result, now=None):
              current = (now or datetime.now(BEIJING)).astimezone(BEIJING)
              kind = "云端演练" if result["simulated"] else "云端只读" if ctx["mode"] == "check" else "云端任务"
              outcome = "成功" if result["ok"] else "模拟失败" if result["simulated"] else "失败"
              message = EmailMessage()
              message["From"] = Address("小黑盒个人通知", addr_spec=config.user)
              message["To"] = Address(addr_spec=config.recipient)
              message["Subject"] = f"[小黑盒][{kind}][{outcome}] 编号 {ctx['id']}"
              message["Date"] = format_datetime(current)
              message["Message-ID"] = make_msgid(domain="heybox-personal.invalid")
              total = sum(result["mutations"].values())
              lines = [f"北京时间：{current.strftime('%Y-%m-%d %H:%M:%S')} +08:00", f"运行编号：{ctx['id']}",
                       f"模式：{ctx['mode']}", f"结果标记：{result['marker']}", f"业务请求尝试次数：{total}", ""]
              if result["ok"]:
                  if ctx["mode"] == "check":
                      lines.append("真实账号只读核验成功，本轮没有提交签到或分享任务。")
                  elif result["marker"] == "CLOUD_RUN_SKIPPED":
                      lines.append("四项在执行时均已完成，本轮全部跳过，尚未新增云端提交证明。")
                  else:
                      lines.append("本轮任务结束后已独立读回服务端状态。")
                      lines.append("本轮提交并核验：" + "，".join(NAMES[key] for key in result["executed"]))
                      lines.append("本轮已完成跳过：" + ("，".join(NAMES[key] for key in result["skipped"]) or "无"))
                  for key in IDS:
                      lines.append(NAMES[key] + "：" + ("已完成" if result["states"][key] == "finish" else "待完成"))
              elif result["simulated"]:
                  lines.extend(["本轮为预设失败演练，没有连接小黑盒，也没有读取或更改真实登录配置。",
                                "模拟错误：APP_AUTH_EXPIRED", "演练任务最终显示红色属于预期，用于验证失败后的邮件与失败状态联动。"])
              else:
                  lines.extend(["本轮未通过，任务链已停止。", "错误代码：" + result["error"],
                                "已发出的请求仍可能生效，请先以check模式只读核对，避免连续重报。"])
                  if result["error"] == "APP_AUTH_EXPIRED":
                      lines.append("在本机重新授权并只读核验后，更新GitHub的HEYBOX_CONFIG_B64 Secret，再用check模式确认恢复。")
                  if result["error"] == "CLOUD_SETUP_FAILED":
                      lines.append("请查看运行链接中检出代码、设置Node或校验上传包的首次失败步骤。")
              lines.extend(["", "运行记录：", ctx["url"], "", "本运行可由网页手动启动或外部定时触发。15:00计划与漏跑监测请在调度站和Healthchecks中核对。"])
              message.set_content("\n".join(lines))
              return message
          
          
          def main(environ=None, smtp_factory=None, emit=print, now=None):
              env = os.environ if environ is None else environ
              try:
                  ctx = context(env)
                  result = read_result(env, ctx)
                  config = read_config(env)
                  message = compose(config, ctx, result, now)
                  send_notice(config, message, smtp_factory)
                  emit("MAIL_SMTP_ACCEPTED")
                  emit("CLOUD_NOTICE_MARKER=" + result["marker"])
                  emit("CLOUD_NOTICE_ID=" + ctx["id"])
                  if env.get("GITHUB_OUTPUT"):
                      with open(env["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                          output.write("task_ok=" + str(result["ok"]).lower() + "\n")
                  return 0
              except Exception as error:
                  emit("MAIL_TEST_ERROR=" + safe_error(error))
                  return 2
          
          
          if __name__ == "__main__":
              raise SystemExit(main())
          PY
      - name: Report independent monitor
        id: monitor
        if: ${{ always() }}
        shell: bash
        env:
          CLOUD_MODE: ${{ inputs.mode }}
          MONITOR_ENABLED: ${{ inputs.monitor }}
          TASK_OUTCOME: ${{ steps.task.outcome }}
          MAIL_OUTCOME: ${{ steps.notify.outcome }}
          TASK_OK: ${{ steps.notify.outputs.task_ok }}
          HC_PING_URL: ${{ inputs.monitor && inputs.mode == 'run' && secrets.HC_PING_URL || '' }}
        run: |
          python3 - <<'PY'
          """Healthchecks reporting only; never reads the Heybox or SMTP credentials."""
          import os
          import re
          import ssl
          from urllib.parse import urlsplit
          from urllib.request import Request, build_opener, HTTPSHandler, HTTPRedirectHandler
          
          
          class MonitorError(Exception):
              pass
          
          
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise MonitorError("MONITOR_REDIRECT_DENIED")
          
          
          def valid_url(value):
              text = str(value or "").strip()
              if not text:
                  raise MonitorError("MONITOR_URL_MISSING")
              try:
                  parsed = urlsplit(text)
                  if parsed.scheme != "https" or parsed.netloc.lower() != "hc-ping.com" or parsed.query or parsed.fragment:
                      raise ValueError()
                  if not re.fullmatch(r"/[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}", parsed.path):
                      raise ValueError()
              except Exception:
                  raise MonitorError("MONITOR_URL_INVALID") from None
              return "https://hc-ping.com" + parsed.path
          
          
          def validate_context(env):
              if env.get("GITHUB_REPOSITORY") != "zhangsan857/heybox-personal" or env.get("GITHUB_REF") != "refs/heads/main" or env.get("GITHUB_EVENT_NAME") != "workflow_dispatch":
                  raise MonitorError("MONITOR_CONTEXT_DENIED")
          
          
          def ping(base, signal, opener=None):
              url = valid_url(base)
              if signal not in {"success", "failure"}:
                  raise MonitorError("MONITOR_SIGNAL_INVALID")
              if signal == "failure":
                  url += "/fail"
              client = opener or build_opener(NoRedirect(), HTTPSHandler(context=ssl.create_default_context()))
              request = Request(url, data=b"", method="POST")
              with client.open(request, timeout=10) as response:
                  if response.status != 200 or response.read(64).strip() != b"OK":
                      raise MonitorError("MONITOR_ACK_INVALID")
          
          
          def task_signal(env):
              # A read-only check, drill, or SMTP-only success cannot mark the daily job healthy.
              if env.get("MONITOR_ENABLED") != "true" or env.get("CLOUD_MODE") != "run":
                  return None
              return "success" if env.get("TASK_OUTCOME") == "success" and env.get("MAIL_OUTCOME") == "success" and env.get("TASK_OK") == "true" else "failure"
          
          
          def safe_monitor_error(error):
              allowed = {"MONITOR_URL_MISSING", "MONITOR_URL_INVALID", "MONITOR_SIGNAL_INVALID", "MONITOR_CONTEXT_DENIED", "MONITOR_REDIRECT_DENIED",
                         "MONITOR_ACK_INVALID", "MONITOR_TEST_URL_CONFLICT", "MONITOR_PROBE_ACTION_INVALID"}
              return str(error) if isinstance(error, MonitorError) and str(error) in allowed else "MONITOR_DELIVERY_NOT_CONFIRMED"
          
          
          def main(environ=None, opener=None, emit=print):
              env = os.environ if environ is None else environ
              try:
                  signal = task_signal(env)
                  if signal is None:
                      emit("MONITOR_SKIPPED")
                      return 0
                  validate_context(env)
                  ping(env.get("HC_PING_URL"), signal, opener)
                  emit("MONITOR_SIGNAL=" + signal)
                  emit("MONITOR_REPORTED")
                  return 0
              except Exception as error:
                  emit("MONITOR_ERROR=" + safe_monitor_error(error))
                  return 2
          
          
          def probe_main(environ=None, opener=None, emit=print):
              env = os.environ if environ is None else environ
              try:
                  validate_context(env)
                  if env.get("PROBE_ACTION") not in {"arm", "recover"}:
                      raise MonitorError("MONITOR_PROBE_ACTION_INVALID")
                  test_url = valid_url(env.get("HC_TEST_PING_URL"))
                  live_url = valid_url(env.get("HC_PING_URL"))
                  if test_url.casefold() == live_url.casefold():
                      raise MonitorError("MONITOR_TEST_URL_CONFLICT")
                  # Deliberately ping once. No timer or repeated ping hides the subsequent missed deadline.
                  ping(test_url, "success", opener)
                  emit("MONITOR_PROBE=" + env["PROBE_ACTION"])
                  emit("MONITOR_PROBE_REPORTED")
                  return 0
              except Exception as error:
                  emit("MONITOR_ERROR=" + safe_monitor_error(error))
                  return 2
          
          
          
          raise SystemExit(main())
          PY
      - name: Enforce task and mail result
        if: ${{ always() }}
        shell: bash
        env:
          TASK_OUTCOME: ${{ steps.task.outcome }}
          MAIL_OUTCOME: ${{ steps.notify.outcome }}
          TASK_OK: ${{ steps.notify.outputs.task_ok }}
          MONITOR_REQUIRED: ${{ inputs.monitor && inputs.mode == 'run' && 'true' || 'false' }}
          MONITOR_OUTCOME: ${{ steps.monitor.outcome }}
        run: |
          if { [ "$MONITOR_REQUIRED" = "true" ] && [ "$MONITOR_OUTCOME" != "success" ]; } || [ "$TASK_OUTCOME" != "success" ] || [ "$MAIL_OUTCOME" != "success" ] || [ "$TASK_OK" != "true" ]; then
            echo 'CLOUD_ACCEPTANCE_FAILED'
            exit 1
          fi
          echo 'CLOUD_ACCEPTANCE_OK'
